<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Temmuz Krallık Sistemi</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .tab { display: none; }
        .tab.active { display: block; }
        .row { background: #222; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

<!-- GEREKLİ ANAHTARLAR -->
<script>
    const BIN_ID = "BURAYA_BIN_ID";
    const MASTER_KEY = "BURAYA_MASTER_KEY";
</script>

<nav>
    <button onclick="tab('tab1')">Puan Tablosu</button>
    <button onclick="tab('tab2')">Kraliyet Paneli</button>
</nav>

<div id="tab1" class="tab active">
    <h3>Güncel Puan Durumu</h3>
    <div id="liste">Yükleniyor...</div>
</div>

<div id="tab2" class="tab">
    <h3>Yönetim</h3>
    <div id="admin-panel"></div>
</div>

<script>
    const oyuncular = ["Bahattin Konut", "Mehmet Can Zile", "Ahmet Ziya Bitim", "Deniz Kuyluk", "Seçkin Yılmaz", "Rüştü Korkmaz", "Recep Koca", "Gökhan Toprak", "Veysi Temel", "Hakan Göktaş", "Murat Gül", "Aytek Evren", "Fatih Öztekin", "Ahmet Erkam Ketmen", "Uğur Ede"];

    function tab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function fetchData() {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': MASTER_KEY} });
        const data = await res.json();
        const obj = data.record.oyuncular;
        
        let html = "";
        let adminHtml = "";
        
        Object.entries(obj).sort((a,b) => b[1] - a[1]).forEach(([isim, puan]) => {
            html += `<div class="row"><span>${isim}</span> <b>${puan}</b></div>`;
            adminHtml += `<div class="row">${isim} <button onclick="guncelle('${isim}', 2)">+2</button><button onclick="guncelle('${isim}', -2)">-2</button></div>`;
        });
        
        document.getElementById('liste').innerHTML = html;
        document.getElementById('admin-panel').innerHTML = adminHtml;
    }

    async function guncelle(isim, miktar) {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': MASTER_KEY} });
        const data = await res.json();
        data.record.oyuncular[isim] += miktar;
        
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY},
            body: JSON.stringify(data.record)
        });
        fetchData();
    }

    setInterval(fetchData, 3000);
    fetchData();
</script>
</body>
</html>
