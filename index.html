<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Temmuz Ayı Krallığı — Liderlik Tablosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-deep:#0e2622;
    --felt:#163832;
    --felt-light:#1f4b3f;
    --ivory:#f1e9d8;
    --ivory-dim:#e5dac2;
    --brass:#c69749;
    --brass-bright:#e0b768;
    --wine:#7a2e2e;
    --wine-bright:#a23b2e;
    --royal-purple: #4a154b;
    --royal-purple-light: #5e1c60;
    --ink:#241d15;
    --line: rgba(241,233,216,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100vh;
    background-color: var(--felt-deep);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:100%; margin:0 auto; padding:16px 16px 140px 16px; }
  
  .ferman{ padding: 20px 12px; text-align:center; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; letter-spacing:.2em; text-transform:uppercase; font-size:10px; color:var(--brass-bright); margin-bottom:6px; }
  .ferman h1{ font-family:'Fraunces', serif; font-weight:700; font-size:26px; color:var(--ivory); margin:0; }
  
  .tile{
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    color:var(--ink); border-radius:12px; padding:14px;
    display:flex; align-items:center; gap:12px; margin-bottom:8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15); cursor:pointer;
    transition: transform 0.1s ease;
  }
  .tile:active { transform: scale(0.98); }

  .tile.rank-1 {
    background: linear-gradient(135deg, var(--wine-bright) 0%, var(--wine) 100%);
    border: 2px solid var(--brass);
    color: var(--ivory);
  }
  .tile.rank-last-four {
    background: linear-gradient(135deg, var(--royal-purple-light) 0%, var(--royal-purple) 100%);
    border: 1px dashed var(--brass-bright);
    color: var(--ivory);
  }

  .rank-badge{
    width:32px; height:32px; border-radius:8px;
    background:var(--felt); color:var(--brass-bright);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
  }
  .rank-1 .rank-badge { background: var(--brass); color: var(--wine); }
  .rank-last-four .rank-badge { background: var(--felt-deep); color: #dfa6e2; }

  .tile-name{ flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
  .tile-name .n{ font-weight:700; font-size:14.5px; }
  .tile-points{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; margin-left:auto; }
  
  .action-buttons { position:fixed; left:16px; right:16px; bottom:16px; display:flex; gap:8px; z-index:40; }
  .fab{ flex:1; background:var(--wine-bright); color:var(--ivory); border:none; border-radius:12px; padding:16px; font-weight:700; font-size:14px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .fab-share { background: var(--felt-light); border: 1.5px solid var(--brass); }

  .overlay{ position:fixed; inset:0; background:rgba(6,14,12,0.75); z-index:50; display:none; backdrop-filter: blur(4px); }
  .overlay.show{ display:block; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; background:var(--felt-deep); border-radius:20px 20px 0 0; max-height:85vh; overflow-y:auto; transform:translateY(100%); transition:transform .3s ease; z-index:51; border-top:1px solid var(--line); padding-bottom: 20px; }
  .sheet.show{ transform:translateY(0); }
  .sheet-inner{ padding:20px; position:relative; }
  .close-x{ position:absolute; top:12px; right:16px; background:none; border:none; color:var(--ivory-dim); font-size:22px; }

  .tabs{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{ padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ivory-dim); font-size:13px; font-weight:600; white-space:nowrap; }
  .tab-btn.active{ background:var(--brass); color:var(--felt-deep); border-color:var(--brass); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  label{ display:block; font-size:11px; color:var(--ivory-dim); margin:14px 0 6px; font-family:'JetBrains Mono'; text-transform: uppercase;}
  select, input{ width:100%; padding:12px; border-radius:8px; border:1px solid var(--line); background:rgba(241,233,216,0.06); color:var(--ivory); font-size:14px; outline:none;}
  .btn{ width:100%; padding:14px; border-radius:10px; border:none; font-weight:700; font-size:14.5px; margin-top:16px; cursor:pointer;}
  .btn-primary{ background:var(--brass); color:var(--felt-deep); }
</style>
</head>
<body>

<div class="wrap">
  <div class="ferman">
    <div class="eyebrow">Temmuz Ayı Kanunları</div>
    <h1>Krallık Liderlik Tablosu</h1>
    <div style="font-size:12px; color:var(--brass-bright); margin-top:6px;" id="leaderLine">Yükleniyor…</div>
  </div>

  <div id="board"></div>
</div>

<div class="action-buttons">
  <button class="fab fab-share" id="openShare">📤 Veriyi Paylaş</button>
  <button class="fab" id="openFab">✛ Puan/Ceza Ekle</button>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <button class="close-x" id="closeSheet">✕</button>
    <div class="tabs">
      <button class="tab-btn active" data-tab="adjust">Hızlı Puan / Ceza</button>
    </div>

    <div class="panel active" id="panel-adjust">
      <label>Yetkili Şifresi</label>
      <input type="password" id="admin-pass" placeholder="Uğur veya Can şifresi">
      
      <label>Oyuncu</label>
      <select id="a-player"></select>
      
      <label>Puan Değişimi (+/-)</label>
      <input type="number" id="a-points" placeholder="Örn: 20 veya -10">
      
      <label>Gerekçe / Açıklama</label>
      <input type="text" id="a-reason" placeholder="Örn: Tatlı Cezası / Madde 9">
      
      <button class="btn btn-primary" id="saveAdjust">Puanı İşle</button>
    </div>
  </div>
</div>

<div class="sheet" id="shareSheet">
  <div class="sheet-inner">
    <button class="close-x" id="closeShareSheet">✕</button>
    <h3 style="color:var(--ivory); font-family:'Fraunces'; margin: 0 0 10px 0;">Veri Eşitleme ve Paylaşım</h3>
    <p style="color:var(--ivory-dim); font-size:12px; line-height:1.4;">Yazılan puanların diğer oyuncularda da görünmesi için güncel veriyi kopyalayıp gruba atın. Diğer üyeler bu kodu kopyalayıp buraya yapıştırarak kendi tablolarını güncelleyebilirler.</p>
    
    <label>Mevcut Veri Kodu (Kopyalayıp Gruba Atın)</label>
    <input type="text" id="exportData" readonly onclick="this.select();">
    
    <label style="margin-top:20px;">Gruptan Gelen Kod (Yapıştırıp Güncelleyin)</label>
    <input type="text" id="importData" placeholder="Buraya yapıştırın...">
    
    <button class="btn btn-primary" id="saveImport">Veriyi İçe Aktar ve Yenile</button>
  </div>
</div>

<script>
const ADMIN_PASSWORDS = ["baho123", "can123"];
const DEFAULT_PLAYERS = ["Bahattin Konut","Mehmet Can Zile","Ahmet Ziya Bitim","Deniz Kuyluk","Seçkin Yılmaz","Rüştü Korkmaz","Recep Koca","Gökhan Toprak","Veysi Temel","Hakan Göktaş","Murat Gül","Aytek Evren","Fatih Öztekin","Ahmet Erkam Ketmen","Uğur Ede"];
let DATA = { players: [...DEFAULT_PLAYERS], adjustments: [] };
const STORAGE_KEY = "okey_krallik_v3";

function loadData(){
  const local = localStorage.getItem(STORAGE_KEY);
  if(local) DATA = JSON.parse(local);
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  renderBoard();
}

function computeTotals(){
  const totals = {};
  DATA.players.forEach(p => totals[p] = 0);
  DATA.adjustments.forEach(a => {
    if(totals.hasOwnProperty(a.player)) totals[a.player] += Number(a.points);
  });
  return totals;
}

function renderBoard(){
  const totals = computeTotals();
  const rows = DATA.players.map(p => ({name:p, total:totals[p]}));
  rows.sort((a,b) => b.total - a.total);

  const board = document.getElementById('board');
  board.innerHTML = "";
  
  rows.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'tile';
    
    if (i === 0) {
      div.className += ' rank-1';
    } else if (i >= rows.length - 4) {
      div.className += ' rank-last-four';
    }

    // İkon Belirleme Mantığı
    let badgeIcon = "";
    if (i === 0) badgeIcon = " 👑";
    if (i >= rows.length - 4) badgeIcon = " 🥞"; // Son 4 için baklava/tatlı tabağı
    
    // Ahmet Erkam Ketmen için şans fıstıkları (taşlar)
    if (r.name === "Ahmet Erkam Ketmen") {
      badgeIcon += " 🥜"; 
    }

    div.innerHTML = `
      <div class="rank-badge">${i+1}</div>
      <div class="tile-name">
        <div class="n">${r.name}${badgeIcon}</div>
      </div>
      <div class="tile-points">${r.total}</div>
    `;

    div.addEventListener('click', () => {
      document.getElementById('a-player').value = r.name;
      openSheet('sheet');
    });

    board.appendChild(div);
  });

  if(rows[0]) document.getElementById('leaderLine').innerHTML = `👑 Şu anki Kral: <b>${rows[0].name}</b> (${rows[0].total} p)`;
  document.getElementById('exportData').value = btoa(unescape(encodeURIComponent(JSON.stringify(DATA))));
}

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const shareSheet = document.getElementById('shareSheet');

function openSheet(targetId){
  overlay.classList.add('show');
  document.getElementById(targetId).classList.add('show');
  fillSelect();
}
function closeAllSheets(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
  shareSheet.classList.remove('show');
}

document.getElementById('openFab').addEventListener('click', () => openSheet('sheet'));
document.getElementById('openShare').addEventListener('click', () => openSheet('shareSheet'));
document.getElementById('closeSheet').addEventListener('click', closeAllSheets);
document.getElementById('closeShareSheet').addEventListener('click', closeAllSheets);
overlay.addEventListener('click', closeAllSheets);

function fillSelect(){
  document.getElementById('a-player').innerHTML = DATA.players.map(p => `<option value="${p}">${p}</option>`).join('');
}

document.getElementById('saveAdjust').addEventListener('click', () => {
  const enteredPass = document.getElementById('admin-pass').value;
  const player = document.getElementById('a-player').value;
  const points = document.getElementById('a-points').value;
  const reason = document.getElementById('a-reason').value || "Manuel Giriş";

  if(!ADMIN_PASSWORDS.includes(enteredPass)) {
    alert("❌ Hatalı Yetkili Şifresi!");
    return;
  }
  if(!points) {
    alert("Lütfen geçerli bir puan girin!");
    return;
  }

  DATA.adjustments.push({ player, points: Number(points), reason });
  saveData();
  closeAllSheets();
  document.getElementById('admin-pass').value = "";
  document.getElementById('a-points').value = "";
  document.getElementById('a-reason').value = "";
  alert("✅ Puan kaydedildi!");
});

document.getElementById('saveImport').addEventListener('click', () => {
  const importValue = document.getElementById('importData').value.trim();
  if(!importValue) return alert("Lütfen veriyi yapıştırın.");
  try {
    const decoded = JSON.parse(decodeURIComponent(escape(atob(importValue))));
    if(decoded.players && decoded.adjustments) {
      DATA = decoded;
      saveData();
      closeAllSheets();
      document.getElementById('importData').value = "";
      alert("🎉 Tablo eşitlendi!");
    } else {
      alert("Hatalı kod formatı.");
    }
  } catch(e) {
    alert("Geçersiz veri kodu.");
  }
});

loadData();
renderBoard();
</script>
</body>
</html>
