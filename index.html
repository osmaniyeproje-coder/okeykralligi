<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temmuz Ayı Krallığı — Liderlik Tablosu</title>
    <style>
        :root{ --felt-deep:#0e2622; --felt:#163832; --felt-light:#1f4b3f; --ivory:#f1e9d8; --ivory-dim:#e5dac2; --brass:#c69749; --brass-bright:#e0b768; --wine:#7a2e2e; --wine-bright:#a23b2e; --ink:#241d15; --green-pos:#4f8f6d; --line: rgba(241,233,216,0.14); }
        body { background: radial-gradient(circle at 50% -10%, var(--felt-light), var(--felt-deep)); margin:0; font-family: sans-serif; color: var(--ivory); padding-bottom:100px; }
        .wrap{ max-width:500px; margin:0 auto; padding:20px; }
        .board-tile{ background: var(--ivory); color: var(--ink); padding:15px; margin-bottom:10px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
        .giant-update-btn { width: 100%; padding: 18px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: bold; margin-bottom: 20px; }
        .fab{ position:fixed; bottom:20px; right:20px; background:var(--wine-bright); color:white; padding:15px 25px; border-radius:50px; border:none; font-weight:bold; }
        .sheet{ position:fixed; bottom:0; left:0; width:100%; background:var(--felt-deep); padding:20px; border-top:2px solid var(--brass); display:none; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; }
        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body>

<div class="wrap">
    <h1>Krallık Liderlik Tablosu</h1>
    <button class="giant-update-btn" id="quickUpdateBtn">⚡ TABLOYU YENİLE</button>
    <div id="syncStatus"></div>
    <div id="board"></div>
</div>

<button class="fab" id="openFab">✛ El Ekle</button>

<div class="sheet" id="sheet">
    <button id="closeSheet" style="background:none; border:none; color:white;">Kapat</button>
    <div class="panel active" id="panel-manual">
        <label>Tarih</label>
        <input type="date" id="m-date">
        <label>Gün/Masa Bilgisi</label>
        <div id="slotsWrap"></div>
        <input type="password" id="m-pass" placeholder="Şifre">
        <button id="saveManual" style="background:green; color:white;">Eli Kaydet ve Buluta Yükle</button>
        <div id="manualStatus"></div>
    </div>
</div>

<script>
    const APP_ID = "okey_kralligi_temmuz_2026_v5";
    const BIN_URL = "https://api.npoint.io/4e0e5a87ba98dc4eb976"; // LİNKİNİZİ BURAYA YAPIŞTIRIN
    const ADMIN_PASSWORDS = ["ugur123", "can123"];
    const STORAGE_KEY = "krallik-temmuz-data";

    let DATA = { players: ["Bahattin Konut","Mehmet Can Zile","Ahmet Ziya Bitim","Deniz Kuyluk","Seçkin Yılmaz","Rüştü Korkmaz","Recep Koca","Gökhan Toprak","Veysi Temel","Hakan Göktaş","Murat Gül","Aytek Evren","Fatih Öztekin","Ahmet Erkam Ketmen","Uğur Ede"], entries: [], adjustments: [] };

    // Senkronizasyon
    async function pullFromCloud() {
        try {
            const res = await fetch(BIN_URL);
            const data = await res.json();
            if(data[APP_ID]) {
                DATA = data[APP_ID];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
                renderBoard();
            }
        } catch(e) { alert("Buluta bağlanılamadı, yerel veriler kullanılıyor."); }
    }

    async function pushToCloud() {
        const res = await fetch(BIN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ [APP_ID]: DATA })
        });
        return res.ok;
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = "";
        const totals = {};
        DATA.players.forEach(p => totals[p] = 0);
        DATA.entries.forEach(e => e.results.forEach(r => totals[r.player] += r.points));
        
        Object.entries(totals).sort((a,b) => b[1] - a[1]).forEach(([name, score]) => {
            board.innerHTML += `<div class="board-tile"><span>${name}</span> <b>${score}</b></div>`;
        });
    }

    document.getElementById('saveManual').addEventListener('click', async () => {
        if(!ADMIN_PASSWORDS.includes(document.getElementById('m-pass').value)) return alert("Hatalı Şifre!");
        
        const results = Array.from(document.querySelectorAll('.p-select')).map(s => ({ player: s.value, points: 5 })); // Basit puan mantığı
        DATA.entries.push({ date: document.getElementById('m-date').value, results });
        
        await pushToCloud();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
        renderBoard();
        document.getElementById('sheet').style.display = 'none';
    });

    document.getElementById('openFab').onclick = () => document.getElementById('sheet').style.display = 'block';
    document.getElementById('closeSheet').onclick = () => document.getElementById('sheet').style.display = 'none';
    document.getElementById('quickUpdateBtn').onclick = pullFromCloud;

    // Başlat
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) DATA = JSON.parse(saved);
    renderBoard();
</script>
</body>
</html>
