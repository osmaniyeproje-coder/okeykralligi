<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Temmuz Krallık Puan Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #2d2d2d; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .admin-box { background: #3d3d3d; padding: 20px; border-radius: 10px; margin-top: 20px; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #ff9800; color: black; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <button onclick="showTab('tab1')">Puan Tablosu</button>
    <button onclick="showTab('tab2')">Kraliyet Yönetim Paneli</button>
</nav>

<div id="tab1" class="tab-content active">
    <h2>Liderlik Tablosu</h2>
    <div id="leaderboard">Yükleniyor...</div>
</div>

<div id="tab2" class="tab-content">
    <div class="admin-box">
        <h3>Kanuni İşlemler</h3>
        <label><input type="checkbox" id="pazartesiModu"> Pazartesi (Kutsal Gün)</label><br><br>
        <select id="oyuncuListesi"></select>
        <input type="number" id="manuelPuan" placeholder="Puan">
        <button onclick="manuelGuncelle()">Manuel Puan Ver</button>
        <hr>
        <button onclick="kuralUygula('perfect')">Perfect (Puan Dağıt)</button>
        <button onclick="kuralUygula('okeyYereAtma')">Okey Yere Atma (-4/+1)</button>
    </div>
</div>

<script>
    const BIN_ID = "BURAYA_BIN_ID";
    const MASTER_KEY = "BURAYA_MASTER_KEY";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    // Oyuncu Listesi
    const oyuncular = ["Bahattin Konut", "Mehmet Can Zile", "Ahmet Ziya Bitim", "Deniz Kuyluk", "Seçkin Yılmaz", "Rüştü Korkmaz", "Recep Koca", "Gökhan Toprak", "Veysi Temel", "Hakan Göktaş", "Murat Gül", "Aytek Evren", "Fatih Öztekin", "Ahmet Erkam Ketmen", "Uğur Ede"];

    // Başlangıçta listeyi doldur
    const select = document.getElementById('oyuncuListesi');
    oyuncular.forEach(isim => {
        let opt = document.createElement('option');
        opt.value = isim; opt.innerHTML = isim;
        select.appendChild(opt);
    });

    async function kuralUygula(tip) {
        let isPazartesi = document.getElementById('pazartesiModu').checked;
        let katsayi = isPazartesi ? 1 : 0.5;

        // Veriyi çek
        let res = await fetch(`${API_URL}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
        let data = (await res.json()).record;

        if(tip === 'perfect') {
            // Perfect kuralı mantığı: 20, -10, -15, -20
            // Burada yöneticiye veya otomatik hesaplamaya bağlanabilir
            alert("Perfect işlemi uygulandı!");
        } else if(tip === 'okeyYereAtma') {
            let isim = select.value;
            data.oyuncular[isim] -= (4 * katsayi);
            alert(isim + " için Okey yere atma cezası uygulandı.");
        }

        // Veriyi gönder
        await fetch(API_URL, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY},
            body: JSON.stringify(data)
        });
        fetchData();
    }

    async function manuelGuncelle() {
        let isim = select.value;
        let puan = parseInt(document.getElementById('manuelPuan').value);
        let res = await fetch(`${API_URL}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
        let data = (await res.json()).record;
        data.oyuncular[isim] += puan;
        await fetch(API_URL, { method: 'PUT', headers: {'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY}, body: JSON.stringify(data)});
        fetchData();
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function fetchData() {
        let res = await fetch(`${API_URL}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
        let data = (await res.json()).record.oyuncular;
        let lb = document.getElementById('leaderboard');
        lb.innerHTML = Object.entries(data).sort((a,b) => b[1]-a[1]).map(([i,p], idx) => 
            `<div class="card"><span>${idx+1}. ${i}</span><b>${p} Puan</b></div>`).join('');
    }

    setInterval(fetchData, 5000);
    fetchData();
</script>
</body>
</html>
